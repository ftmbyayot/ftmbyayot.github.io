<style>
  /* Layout: satu kolum ala senarai semak, mobile-first. #slug = satu set; tanpa slug = senarai semua set */
  :root {

    --warn-soft: #FDF0D9;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16111A; --surface: #211A26; --ink: #F2EAF5; --muted: #B4A7BD; --line: #3A2F42;
      --accent: #F07CA0; --accent-ink: #2A0F1A; --accent-soft: #3B2130;
      --ok: #6CC79C; --ok-soft: #1C3328; --warn: #F2B866; --warn-soft: #3A2B14;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16111A; --surface: #211A26; --ink: #F2EAF5; --muted: #B4A7BD; --line: #3A2F42;
    --accent: #F07CA0; --accent-ink: #2A0F1A; --accent-soft: #3B2130;
    --ok: #6CC79C; --ok-soft: #1C3328; --warn: #F2B866; --warn-soft: #3A2B14;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 0 48px;
  }
  .wrap { max-width: 600px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
  .wrap.wide { max-width: 980px; }
  .wrap.wide .search, .wrap.wide .lead { max-width: 600px; }
  a { color: var(--accent); }

  .back {
    margin-top: 20px; align-self: flex-start;
    font-size: 14px; font-weight: 600; text-decoration: none; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }

  .lead { margin: 0; color: var(--muted); font-size: 16px; max-width: 34em; }
  .checked-on { margin: 0; font-size: 13px; color: var(--muted); }

  .steps {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px;
  }
  .steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .steps .n {
    flex: none; width: 24px; height: 24px; border-radius: 50%;

  .progress {

  .name-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.25; margin: 0; }
  .qty {
    font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;

  .why { margin: 0; }
  .tip { margin: 0; font-size: 13.5px; color: var(--muted); }
  .tip b { color: var(--ink); font-weight: 600; }
  .warn {

  .actions {
    grid-column: 1 / -1; margin-top: 10px;

  .have-toggle {

  .have-toggle input { appearance: none; -webkit-appearance: none; margin: 0; width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid var(--muted); display: grid; place-items: center; cursor: pointer; }

  .have-toggle:has(input:checked) { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

  .buy:hover { filter: brightness(1.06); }
  .buy:active { transform: scale(.97); }
  .buy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .item.have .buy { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .buy.pending { background: transparent; color: var(--muted); border: 1.5px dashed var(--muted); cursor: default; font-weight: 600; }
  .item.have .buy.pending { box-shadow: none; color: var(--muted); }

  /* Barang tanpa link: kata carian + butang Salin */
  .find { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13.5px; color: var(--muted); min-width: 0; }
  .find .kw {
    font-weight: 700; color: var(--ink); background: var(--accent-soft);
    padding: 5px 11px; border-radius: 99px; overflow-wrap: anywhere;
  }
  .copy {
    font: inherit; font-size: 13px; font-weight: 700; color: var(--accent);
    background: transparent; border: 1.5px solid var(--accent); border-radius: 99px;
    padding: 6px 12px; cursor: pointer; min-height: 32px;
  }
  .copy:hover { background: var(--accent-soft); }
  .copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .copy.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

  /* Senarai semua set */
  .search { display: flex; flex-direction: column; gap: 6px; }
  .search label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .search input {
    font: inherit; font-size: 16px; color: var(--ink);
    padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);

  .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .group { display: flex; flex-direction: column; gap: 12px; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .group-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
  .group-head span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Page utama: statistik, cip fasa, kad "mula di sini", kumpulan fasa, kad set */
  .stats { margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
  .follow {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 14px; border-radius: 99px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 14px;
  }
  .follow b { color: var(--accent); }
  .follow:hover { border-color: var(--accent); }
  .follow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .follow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stats b { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -10px; }
  .chip {
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink);
    padding: 7px 13px; min-height: 36px; border-radius: 99px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip .c { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip[aria-pressed="true"] .c { color: inherit; opacity: .7; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .results { display: flex; flex-direction: column; gap: 32px; }

  .feature {
    display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 14px 16px; align-items: center;
    padding: 20px; border-radius: 22px; text-decoration: none; color: var(--ink);
    background: var(--accent-soft); border: 1.5px solid transparent;
    transition: border-color .15s ease;
  }
  .feature:hover { border-color: var(--accent); }
  .feature:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .f-icon { width: 60px; height: 60px; border-radius: 18px; background: var(--surface); color: var(--accent); display: grid; place-items: center; }
  .f-icon svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .f-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .f-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .f-body strong { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.15; text-wrap: balance; }
  .f-text { font-size: 14px; color: var(--muted); }
  .f-cta {
    grid-column: 1 / -1; justify-self: start;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 16px; border-radius: 99px; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 14px;

  .f-cta svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .phase { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 16px; }

  .phase-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; min-width: 0; }

  .set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .set-card {

  a.set-card:hover { border-color: var(--accent); }

  .set-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .set-card.done { border-color: var(--ok); }

  .sc-icon { width: 44px; height: 44px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .set-card.done .sc-icon { background: var(--ok-soft); color: var(--ok); }
  .sc-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sc-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .set-no { font-size: 11.5px; font-weight: 700; color: var(--accent); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .set-card strong { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.2; }
  .sc-items { font-size: 13px; line-height: 1.45; color: var(--muted); }
  .sc-meta { margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sc-meta .mine { color: var(--ok); font-weight: 700; }
  .sc-bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 2px; }
  .sc-bar i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
  .soon-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .soon-list li {
    display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
    padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 14.5px;
  }
  .soon-list .no { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .soon-list .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .empty { margin: 0; color: var(--muted); font-size: 14px; }

  .notice {
    padding: 18px; border-radius: 18px; background: var(--surface); border: 1px dashed var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  .notice p { margin: 0; }

  footer { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-block: 18px 0; }
  footer p { margin: 0; max-width: 40em; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<!--
  DATA SET. Untuk kemas kini: ubah blok JSON ini sahaja, kemudian publish semula.
  - Set "siap" = ada barang DAN setiap barang ada "link" ATAU "cari". Set yang belum lengkap masih boleh dibuka dengan #slug untuk semakan.
  - "link" = link affiliate Shopee (sub_id1=set, sub_id2=nombor set, contoh set01). Mulai 9 Okt 2026 (akaun affiliate disekat), tiada link baru ditambah.
  - "tiktok" = link affiliate TikTok Shop (akaun @senangcari3). Kalau ada, butang "Lihat di TikTok Shop" menggantikan butang Shopee. "tiktok_date" = tarikh link dijana (YYYY-MM-DD); link tamat lebih kurang 100 hari, jana semula selepas itu.
  - "cari" = kata carian untuk barang tanpa link. Dipaparkan dengan butang "Salin". Kosong + tiada link = butang "Link Shopee belum dimasukkan".
  - "product" = nama produk Shopee yang dipilih (untuk rujukan semakan harian, tak dipaparkan).
  - "icon" = baju | bedung | lampin | tisu | krim | sarung | termometer | botol | beg | pam | mandi | mangkuk | bulan | firstaid | hadiah | stroller | sabun | gunting | bajuibu | rak | kamera | air | gigi | kotak
  - "warn" / "note" pada set = amaran / nota di bawah tajuk set.
  - "checked" = tarikh link terakhir disemak (YYYY-MM-DD).
  - Website ftmbyayot.github.io (repo github.com/ftmbyayot/ftmbyayot.github.io) = salinan page ini sebagai index.html penuh (doctype, head, meta og). Tambah snippet Cloudflare Web Analytics ini sebelum </body> dalam index.html sahaja (bukan dalam page ini):
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "578cd21c3a764562944e11f8bc77ff7e"}'></script>
  - "fasa" = kumpulan di page utama: bersalin | pantang | menyusu | makan | harian | tidur | keluar | kerja | hadiah. Set tanpa fasa masuk "Lain-lain".
-->

    const count = id => SETS.filter(s => phaseOf(s) === id).length;
    app.innerHTML = `
      <header class="top">
        <div class="eyebrow">Panduan untuk FTM</div>
        <h1>Set Barang FTM</h1>
        <p class="lead">Tak pasti nak beli apa dulu? Pilih set ikut fasa awak. Setiap set senaraikan barang asas, sebab ia perlu, tips, dan cara cari produknya.</p>
        <p class="stats"><span><b>${SETS.length}</b> set</span><span><b>${totalItems}</b> barang</span><span><b>${PHASES.length}</b> fasa</span></p>
        <a class="follow" href="https://www.tiktok.com/@senangcari3" target="_blank" rel="noopener">Tips harian di TikTok: <b>@senangcari3</b> ${ARROW}</a>
      </header>
      <div class="search">
        <label for="cari">Cari set atau barang</label>
        <input id="cari" type="search" placeholder="Contoh: pam susu, berpantang, mandi" autocomplete="off">
      </div>
      <div class="chips" role="group" aria-label="Tapis ikut fasa">
        <button type="button" class="chip" data-phase="semua">Semua <span class="c">${SETS.length}</span></button>
        ${PHASES.map(p => `<button type="button" class="chip" data-phase="${p.id}">${esc(p.label)} <span class="c">${count(p.id)}</span></button>`).join("")}
      </div>
      <div class="results" id="results"></div>
      ${FOOTER}`;

    const results = document.getElementById("results");
    const chips = app.querySelector(".chips");
    const draw = () => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.phase === state.phase)));
      const q = norm(state.q).trim();
      const match = s => !q || norm(s.title).includes(q) || String(s.no) === q || s.items.some(it => norm(it.name).includes(q));
      const groups = [...PHASES, { id: "lain", title: "Lain-lain", icon: "kotak", desc: "" }]
        .filter(p => state.phase === "semua" || p.id === state.phase)
        .map(p => ({ p, sets: SETS.filter(s => phaseOf(s) === p.id && match(s)) }))
        .filter(g => g.sets.length);
      const start = SETS.find(s => s.no === 1);
      const feature = !q && state.phase === "semua" && start && isLive(start) ? `
        <a class="feature" href="#${esc(start.slug)}">
          <span class="f-icon">${svg("baju")}</span>
          <span class="f-body">
            <span class="f-eyebrow">Baru nak mula? Mula di sini</span>
            <strong>${esc(start.title)}</strong>
            <span class="f-text">${start.items.length} barang asas yang baby perlukan dari hari pertama di rumah.</span>
          </span>
          <span class="f-cta">Buka set ${ARROW}</span>
        </a>` : "";
      results.innerHTML = feature + (groups.length
        ? groups.map(({ p, sets }) => `
        <section class="phase" id="fasa-${p.id}" aria-labelledby="h-${p.id}">
          <div class="phase-head">
            <span class="p-icon">${svg(p.icon)}</span>
            <h3 id="h-${p.id}">${esc(p.title)}</h3>
            <span class="count">${sets.length} set</span>
            ${p.desc ? `<p>${esc(p.desc)}</p>` : ""}
          </div>
          <div class="set-grid">${sets.map(setCard).join("")}</div>
        </section>`).join("")
        : `<p class="empty">Tiada set yang padan dengan "${esc(state.q)}". Cuba perkataan lain, contohnya mandi atau pam.</p>`);
    };
    chips.addEventListener("click", e => {
      const b = e.target.closest(".chip");
      if (!b) return;
      state.phase = b.dataset.phase;
      try { history.replaceState(null, "", state.phase === "semua" ? "#semua" : "#fasa-" + state.phase); } catch (err) {}
      draw();
    });
    document.getElementById("cari").addEventListener("input", e => { state.q = e.target.value; draw(); });
    draw();
  }

  function renderSoon(set) {
    app.innerHTML = `
      <a class="back" href="#semua">${BACK} Semua set</a>
      <header>
        <div class="eyebrow">Set ${pad(set.no)} · Panduan untuk FTM</div>
        <h1>${esc(set.title)}</h1>
      </header>
      <div class="notice">
        <p><b>Set ini sedang disediakan.</b></p>
        <p>Senarai barang dan link Shopee untuk set ini akan dimasukkan tak lama lagi. Sementara itu, tengok set yang dah siap.</p>
        <p><a href="#semua">Lihat semua set</a></p>
      </div>
      ${FOOTER}`;
  }

  function renderSet(set) {
    const have = loadHave(set.slug);
    const total = set.items.length;
    app.innerHTML = `
      <a class="back" href="#semua">${BACK} Semua set</a>
      <header>
        <div class="eyebrow">Set ${pad(set.no)} · Panduan untuk FTM</div>
        <h1>${esc(set.title)}</h1>
        ${set.intro ? `<p class="lead">${esc(set.intro)}</p>` : ""}
        ${set.checked ? `<p class="checked-on">Link disemak pada ${esc(tarikh(set.checked))}</p>` : ""}
        ${set.warn ? `<p class="warn">${esc(set.warn)}</p>` : ""}
        ${set.note ? `<p class="tip"><b>Nota:</b> ${esc(set.note)}</p>` : ""}
      </header>
      <ol class="steps" aria-label="Cara guna">
        <li><span class="n">1</span><span>Tanda barang yang awak dah ada.</span></li>
        <li><span class="n">2</span><span>Tekan butang <b>Lihat</b> untuk buka produk, atau <b>Salin</b> kata carian dan cari sendiri dalam app.</span></li>
        <li><span class="n">3</span><span>Add to cart, kemudian checkout ikut bajet awak.</span></li>
      </ol>
      <div class="progress" aria-live="polite">
        <div class="progress-row"><strong id="haveCount"></strong><span id="needCount"></span></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
      <div class="list" id="list">${set.items.map(it => {
        const buy = it.tiktok
          ? `<a class="buy" href="${esc(it.tiktok)}" target="_blank" rel="noopener sponsored">Lihat di TikTok Shop ${ARROW}</a>`
          : it.link
          ? `<a class="buy" href="${esc(it.link)}" target="_blank" rel="noopener sponsored">Lihat di Shopee ${ARROW}</a>`
          : it.cari
          ? `<span class="find"><span>Kata carian:</span><span class="kw">${esc(it.cari)}</span><button type="button" class="copy" data-copy="${esc(it.cari)}" aria-label="Salin kata carian ${esc(it.cari)}">Salin</button></span>`
          : `<span class="buy pending" aria-disabled="true">Link Shopee belum dimasukkan</span>`;
        return `
        <article class="item${have[it.id] ? " have" : ""}">
          <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[it.icon] || ICONS.kotak}</svg></div>
          <div class="body">
            <div class="name-row"><h2>${esc(it.name)}</h2>${it.qty ? `<span class="qty">${esc(it.qty)}</span>` : ""}</div>
            <p class="why">${esc(it.why)}</p>
            ${it.warn ? `<p class="warn">${esc(it.warn)}</p>` : ""}
            ${it.tip ? `<p class="tip"><b>Tip:</b> ${esc(it.tip)}</p>` : ""}
          </div>
          <div class="actions">
            <label class="have-toggle" for="have-${esc(set.slug)}-${esc(it.id)}">
              <input type="checkbox" id="have-${esc(set.slug)}-${esc(it.id)}" data-id="${esc(it.id)}"${have[it.id] ? " checked" : ""}>
              Dah ada
            </label>
            ${buy}
          </div>
        </article>`;
      }).join("")}</div>
      <a class="back" href="#fasa-${esc(phaseOf(set))}">${BACK} Lihat set lain dalam fasa ini</a>
      ${FOOTER}`;

    const refresh = () => {
      const n = set.items.filter(it => have[it.id]).length;
      document.getElementById("haveCount").textContent = `Dah ada ${n}/${total}`;
      document.getElementById("needCount").textContent = n === total ? "Semua dah lengkap" : `Perlu beli ${total - n} barang`;
      document.getElementById("barFill").style.width = (n / total * 100) + "%";
    };
    document.getElementById("list").addEventListener("change", e => {
      const box = e.target.closest("input[data-id]");
      if (!box) return;
      if (box.checked) have[box.dataset.id] = true; else delete have[box.dataset.id];
      box.closest(".item").classList.toggle("have", box.checked);
      saveHave(set.slug, have);
      refresh();
    });
    document.getElementById("list").addEventListener("click", async e => {
      const btn = e.target.closest("button.copy");
      if (!btn) return;
      const text = btn.dataset.copy || "";
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch (err) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
        } catch (err2) { ok = false; }
      }
      btn.textContent = ok ? "Disalin" : "Salin manual";
      btn.classList.toggle("done", ok);
      setTimeout(() => { btn.textContent = "Salin"; btn.classList.remove("done"); }, 1800);
    });
    refresh();
  }

  function route() {
    const slug = decodeURIComponent(location.hash.replace(/^#/, ""));
    const set = SETS.find(s => s.slug === slug);
    app.classList.toggle("wide", !set);
    if (!set) renderIndex(slug.startsWith("fasa-") ? slug.slice(5) : "semua");
    else if (hasItems(set)) renderSet(set);
    else renderSoon(set);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
